# Render blueprint — one-click deploy.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: language-detection-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: WEB_CONCURRENCY
        value: 1
